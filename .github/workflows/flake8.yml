---
name: Flake8 CI
on:  # yamllint disable-line rule:truthy
  push:
    branches:
      - main
      - develop
    paths:
      - "src/**"
  pull_request:
    branches-ignore:
      - docs
      - gh-pages
    paths:
      - "src/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v2

      - name: Flake8 with annotations
        uses: TrueBrain/actions-flake8@v1.4.1
        with:
          # path: src
          max_line_length: 150
